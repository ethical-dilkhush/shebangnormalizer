[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shebangnormalizer"
version = "0.1.0"
description = "Normalize script shebangs to portable forms."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Dilkhush Kumar", email = "ethicaldilkhush@gmail.com"}]
keywords = ["shebang", "cli", "normalization", "developer-tools", "portability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
shebangnormalizer = "shebangnormalizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
